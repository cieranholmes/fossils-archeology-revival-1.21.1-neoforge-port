plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
        }
    }
    maven {
        name = 'MoreHitboxes'
        url = 'https://dl.cloudsmith.io/public/darkpred-mods/more-hitboxes/maven/'
        content {
            includeGroup('com.github.darkpred.morehitboxes')
        }
    }
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
        content {
            includeGroup('com.github.glitchfiend')
        }
    }

    // Phase 9 compat-tier repositories (all optional; the mod runs fine without any of these present)
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup('mezz.jei')
        }
    }
    maven {
        name = 'Sleeping Town (EMI)'
        url = 'https://repo.sleeping.town/'
        content {
            includeGroup('dev.emi')
        }
    }
    maven {
        name = 'Shedaniel (REI, Cloth Config)'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup('me.shedaniel')
            includeGroup('me.shedaniel.cloth')
        }
    }
    maven {
        name = 'Architectury (REI transitive dep)'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup('dev.architectury')
        }
    }
    maven {
        name = 'CreateMod (Create/Flywheel/Ponder)'
        url = 'https://maven.createmod.net/'
        content {
            includeGroup('com.simibubi.create')
            includeGroup('dev.engine-room.flywheel')
            includeGroup('net.createmod.ponder')
        }
    }
    maven {
        name = 'ithundxr snapshots (Registrate)'
        url = 'https://maven.ithundxr.dev/snapshots/'
        content {
            includeGroup('com.tterrag.registrate')
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup('maven.modrinth')
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup('curse.maven')
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Generated files are sometimes also checked into src/main/resources to ship them; when both
// copies are identical, keep the first one encountered instead of failing the build.
tasks.named('processResources') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }


// more-hitboxes-neoforge's own neoforge.mods.toml never declares a [[mixins]] block for its bundled
// morehitboxes.mixins.json, so none of its mixins are ever loaded by NeoForge's mod loader (confirmed by
// inspecting the published jar directly - GeckoLib's and TerraBlender's jars both declare theirs correctly
// the same way). These tasks resolve the original jar, add the single missing TOML entry, and repack it;
// the patched jar is what's actually depended on below, in place of the Maven coordinate.
def moreHitboxesOriginal = configurations.detachedConfiguration(
        dependencies.create("com.github.darkpred.morehitboxes:morehitboxes-neoforge-${minecraft_version}:${more_hitboxes_version}")
)

def moreHitboxesExtractedDir = layout.buildDirectory.dir("morehitboxes-extracted")

def extractMoreHitboxes = tasks.register("extractMoreHitboxes", Copy) {
    from { zipTree(moreHitboxesOriginal.singleFile) }
    into moreHitboxesExtractedDir
}

def patchMoreHitboxesToml = tasks.register("patchMoreHitboxesToml") {
    dependsOn extractMoreHitboxes
    def tomlFileProvider = moreHitboxesExtractedDir.map { it.file("META-INF/neoforge.mods.toml") }
    inputs.file(tomlFileProvider)
    outputs.file(tomlFileProvider)
    doLast {
        def tomlFile = tomlFileProvider.get().asFile
        def text = tomlFile.text
        if (!text.contains('[[mixins]]')) {
            tomlFile.text = text + '\n[[mixins]]\nconfig="morehitboxes.mixins.json"\n'
        }
    }
}

// The original jar also has no Automatic-Module-Name, which NeoForge's own Jar-in-Jar embedding
// (below) requires for any embedded dependency that isn't a resolvable Maven coordinate - without
// it, the patchedMoreHitboxesJar task fails with "Cannot embed local file dependency ... because it
// has no explicit Java module name."
def patchMoreHitboxesManifest = tasks.register("patchMoreHitboxesManifest") {
    dependsOn extractMoreHitboxes
    def manifestFileProvider = moreHitboxesExtractedDir.map { it.file("META-INF/MANIFEST.MF") }
    inputs.file(manifestFileProvider)
    outputs.file(manifestFileProvider)
    doLast {
        def manifestFile = manifestFileProvider.get().asFile
        def text = manifestFile.text
        if (!text.contains('Automatic-Module-Name:')) {
            // The manifest's main-attributes section ends at its first blank line; anything after that
            // is parsed as a distinct per-entry section requiring its own "Name:" attribute first, so the
            // new attribute must be inserted before any trailing blank line(s), not blindly appended after.
            def mainSection = text.replaceAll(/(\r?\n)+$/, '')
            manifestFile.text = mainSection + '\r\nAutomatic-Module-Name: morehitboxes\r\n'
        }
    }
}

def patchedMoreHitboxesJar = tasks.register("patchedMoreHitboxesJar", Zip) {
    dependsOn patchMoreHitboxesToml, patchMoreHitboxesManifest
    from moreHitboxesExtractedDir
    archiveFileName = "morehitboxes-neoforge-${minecraft_version}-${more_hitboxes_version}-patched.jar"
    destinationDirectory = layout.buildDirectory.dir("patchedLibs")
}

dependencies {
    // Hard dependencies: the mod does not load/function without these (see the migration plan's dependency policy)
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${gecko_lib_version}"
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${terra_blender_version}"
    // more-hitboxes is NOT depended on directly here - its neoforge.mods.toml is missing the [[mixins]]
    // declaration for morehitboxes.mixins.json entirely (confirmed by unzipping the published jar and
    // comparing against GeckoLib's/TerraBlender's, which both declare theirs correctly), so NeoForge's mod
    // loader never discovers or loads any of its 9 server-side + 7 client-side mixins - not a Java 21/Mixin
    // compatibility issue, just a missing TOML entry in this "-alpha" release. patchedMoreHitboxesJar below
    // repacks the resolved jar with that one line added; see .claude/memory/fossils_combat_and_scaling_bugs_fixed.md.
    //
    // The patched jar previously only satisfied the dev-time (runClient/runServer) classpath, since
    // "implementation files(...)" never ships inside the built mod jar - only this project's own compiled
    // classes do. In production, more-hitboxes was declared a separate required mod, so end users installed
    // whatever unpatched jar they got from Modrinth/CurseForge, and the same missing-mixins bug came right
    // back outside of Gradle's dev environment. "jarJar" below embeds the patched jar directly inside our
    // own shipped mod jar (NeoForge's Jar-in-Jar mechanism), so the fix travels with the mod - see
    // .claude/memory/fossils_morehitboxes_mixin_registration_fix.md.
    implementation files(patchedMoreHitboxesJar)
    jarJar files(patchedMoreHitboxesJar)

    // Phase 9 compat-tier dependencies: all optional (compileOnly, plus runtimeOnly only so the
    // integration can actually be exercised in runClient/runServer during development - none of these
    // are bundled into the shipped mod jar). See .claude/memory/fossils_phase9_compat_research.md.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"

    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"

    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"

    compileOnly "maven.modrinth:farmers-delight:${farmers_delight_version}"
    runtimeOnly "maven.modrinth:farmers-delight:${farmers_delight_version}"

    // Carry On's own published "neoforge" 1.21.1 jar (both Modrinth and CurseForge) is actually a
    // Forge-format jar (legacy META-INF/mods.toml, Forge-style MixinConfigs manifest attribute, no
    // neoforge.mods.toml) - NeoForge's own loader hard-rejects it at boot ("is for Minecraft Forge
    // or an older version of NeoForge, and cannot be loaded"), which crashes the whole dev
    // environment if present on the runtime mod-loading classpath. This looks like an upstream
    // mislabeling bug (see .claude/memory/fossils_phase9_task11_wrapup.md), not something fixable
    // here. Kept as compileOnly only, so PickupHandlerMixin.java (require=0, safe no-op if Carry
    // On isn't actually loaded) still compiles - deliberately NOT runtimeOnly until a genuine
    // NeoForge 1.21.1 build appears upstream.
    compileOnly "maven.modrinth:carry-on:${carry_on_version}"

    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    // ModCreateRecipeProvider references Create's datagen classes unconditionally (not gated behind
    // a runtime isModLoaded check, since datagen has no "runtime" in the gameplay sense) - runData
    // needs the real Create+Flywheel mod jars present or it NoClassDefFoundErrors at boot.
    runtimeOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    // Create's own hard dependencies (discovered at runData boot time)
    runtimeOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    runtimeOnly "com.tterrag.registrate:Registrate:${registrate_version}"

    // Alex's Mobs has no official NeoForge build; user-approved unofficial "Alex's Mobs Continued"
    // port (see fossils_phase9_compat_research.md). Keeps the original "alexsmobs" modid/package,
    // but replaces the old Citadel dependency with its own CodxLib requirement.
    compileOnly "maven.modrinth:alexs-mobs-continued:${alex_mobs_version}"
    runtimeOnly "maven.modrinth:alexs-mobs-continued:${alex_mobs_version}"
    runtimeOnly "maven.modrinth:codxlib:${codxlib_version}"

    // Farmer's Delight addon compat (Phase 9 task 10) - each is optional, gated at runtime by
    // ModList.isLoaded(...) in FarmersDelightAddonCompat/AddonConstants. See
    // .claude/memory/fossils_phase9_task10_addon_compat.md for the full port-vs-drop audit.
    compileOnly "maven.modrinth:brewin-and-chewin:${brewin_and_chewin_version}"
    runtimeOnly "maven.modrinth:brewin-and-chewin:${brewin_and_chewin_version}"
    compileOnly "maven.modrinth:coffee-delight:${coffee_delight_version}"
    runtimeOnly "maven.modrinth:coffee-delight:${coffee_delight_version}"
    compileOnly "maven.modrinth:corn-delight:${corn_delight_version}"
    runtimeOnly "maven.modrinth:corn-delight:${corn_delight_version}"
    // Corn Delight's own hard dependency - needed on our classpath too since CornDelightCompat's
    // FoodMappings calls resolve DeferredItem<ItemFoodBase>/<ItemFoodSeeds> generic types from this lib.
    compileOnly "maven.modrinth:mmlib:${mmlib_version}"
    runtimeOnly "maven.modrinth:mmlib:${mmlib_version}"
    compileOnly "maven.modrinth:crabbers-delight:${crabbers_delight_version}"
    runtimeOnly "maven.modrinth:crabbers-delight:${crabbers_delight_version}"
    compileOnly "maven.modrinth:cultural-delights:${cultural_delights_version}"
    runtimeOnly "maven.modrinth:cultural-delights:${cultural_delights_version}"
    compileOnly "maven.modrinth:ends-delight:${ends_delight_version}"
    runtimeOnly "maven.modrinth:ends-delight:${ends_delight_version}"
    compileOnly "maven.modrinth:enders-delight:${enders_delight_version}"
    runtimeOnly "maven.modrinth:enders-delight:${enders_delight_version}"
    compileOnly "maven.modrinth:expanded-delight:${expanded_delight_version}"
    runtimeOnly "maven.modrinth:expanded-delight:${expanded_delight_version}"
    // Farmer's Respite (Unofficial Port) v3.0.0 - the only NeoForge 1.21.1 build that exists -
    // crashes at boot with "Adding duplicate key 'ResourceKey[minecraft:menu / farmersrespite:kettle]'
    // to registry" (a genuine upstream double-registration bug in the port itself, unrelated to our
    // compat code, confirmed via runData - see .claude/memory/fossils_phase9_task11_wrapup.md). Kept
    // as compileOnly only so FarmerRespiteCompat.java still compiles; deliberately NOT runtimeOnly
    // until upstream fixes this or a different build appears.
    compileOnly "maven.modrinth:farmers-respite-unofficial-port:${farmers_respite_version}"
    compileOnly "maven.modrinth:festive-delight:${festive_delight_version}"
    runtimeOnly "maven.modrinth:festive-delight:${festive_delight_version}"
    compileOnly "maven.modrinth:miners-delight:${miners_delight_version}"
    runtimeOnly "maven.modrinth:miners-delight:${miners_delight_version}"
    // Miner's Delight's own hard dependency (discovered at runData boot time: "requires lodestone 1.7.0+")
    runtimeOnly "maven.modrinth:lodestonelib:${lodestonelib_version}"
    compileOnly "maven.modrinth:oceans-delight:${oceans_delight_version}"
    runtimeOnly "maven.modrinth:oceans-delight:${oceans_delight_version}"
    compileOnly "maven.modrinth:seed-delight:${seed_delight_version}"
    runtimeOnly "maven.modrinth:seed-delight:${seed_delight_version}"

    // CurseForge-only addons (no Modrinth build exists), resolved via CurseMaven (curse.maven:<name>-<projectId>:<fileId>)
    compileOnly "curse.maven:alexs-delight-556448:${alexs_delight_file}"
    runtimeOnly "curse.maven:alexs-delight-556448:${alexs_delight_file}"
    compileOnly "curse.maven:casualness-delight-909519:${casualness_delight_file}"
    runtimeOnly "curse.maven:casualness-delight-909519:${casualness_delight_file}"
    compileOnly "curse.maven:argentinasdelightreborn-831127:${argentinas_delight_reborn_file}"
    runtimeOnly "curse.maven:argentinasdelightreborn-831127:${argentinas_delight_reborn_file}"
    // Argentina's Delight Reborn's own hard dependency (discovered at runData boot time:
    // NoClassDefFoundError on dev.kosmx.playerAnim.api.layered.IAnimation)
    runtimeOnly "maven.modrinth:playeranimator:${playeranimator_version}"
    compileOnly "curse.maven:butchers-delight-1572022:${butchers_delight_file}"
    runtimeOnly "curse.maven:butchers-delight-1572022:${butchers_delight_file}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
